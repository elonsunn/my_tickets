name: my-tickets

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=mytickets
      - POSTGRES_PASSWORD=mytickets
      - POSTGRES_DB=mytickets
    ports:
      - "54321:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mytickets -d mytickets"]
      interval: 20s
      timeout: 5s
      retries: 10

volumes:
  pgdata: